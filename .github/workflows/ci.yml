name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  coherence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm run check:coherence
      - name: Validate the Hermes Compose contract
        run: HERMES_API_KEY=ci-only-not-a-runtime-secret docker compose -f infrastructure/docker-compose.dev.yml config --quiet

  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: noc
          POSTGRES_PASSWORD: noc
          POSTGRES_DB: noc_report_test
        ports: ["55432:5432"]
        options: >-
          --health-cmd="pg_isready -U noc"
          --health-interval=5s --health-timeout=5s --health-retries=10
      rabbitmq:
        image: rabbitmq:3.13-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: noc
          RABBITMQ_DEFAULT_PASS: noc-rabbit-secret
        ports: ["55672:5672", "55673:15672"]
        options: >-
          --health-cmd="rabbitmq-diagnostics -q ping"
          --health-interval=5s --health-timeout=5s --health-retries=10
      minio:
        image: minio/minio:RELEASE.2025-04-22T22-12-26Z
        env:
          MINIO_ROOT_USER: noc-minio
          MINIO_ROOT_PASSWORD: noc-minio-secret
        ports: ["59000:9000", "59091:9091"]
        options: >-
          --health-cmd="curl -f http://localhost:9000/minio/health/live || exit 1"
          --health-interval=5s --health-timeout=5s --health-retries=10
    env:
      DATABASE_URL: postgresql+psycopg2://noc:noc@localhost:55432/noc_report_test
      TEST_DATABASE_URL: postgresql+psycopg2://noc:noc@localhost:55432/noc_report_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API dependencies
        working-directory: apps/api
        run: pip install -r requirements.txt -c constraints.txt
      - name: Wait for MinIO
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:59000/minio/health/live && break
            sleep 2
          done
      - name: Apply DB migrations
        working-directory: apps/api
        run: alembic upgrade head
      - name: Verify ORM and migrations are coherent
        working-directory: apps/api
        run: alembic check
      - name: Run API test suite
        working-directory: apps/api
        run: python -m pytest tests/ -q

  deterministic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deterministic test dependencies
        run: |
          pip install pytest
          pip install -r bridge/requirements.txt -c bridge/constraints.txt
      - name: Run preprocessing and report-support tests
        env:
          PYTHONPATH: sandbox:bridge
        run: python -m pytest sandbox/tests/ bridge/tests/ -q
