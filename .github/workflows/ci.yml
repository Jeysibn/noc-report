name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  # AI cost-optimization mission Phase 2, Issue 9: CI previously ran only
  # the frontend job above — none of the API, sandbox, bridge, cache,
  # telemetry, or structured-output regression tests added across the
  # cost-optimization work actually ran anywhere except a developer's own
  # machine. This job runs the real API test suite (Postgres +
  # MinIO + RabbitMQ services, same ports/credentials as
  # infrastructure/docker-compose.dev.yml, so app defaults need no
  # override) plus the sandbox unit tests (preprocessing, cache/telemetry
  # shape, structured-output parsing, escalation) that don't need any of
  # those services at all.
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: noc
          POSTGRES_PASSWORD: noc
          POSTGRES_DB: noc_report
        ports: ["55432:5432"]
        options: >-
          --health-cmd="pg_isready -U noc"
          --health-interval=5s --health-timeout=5s --health-retries=10
      rabbitmq:
        image: rabbitmq:3.13-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: noc
          RABBITMQ_DEFAULT_PASS: noc-rabbit-secret
        ports: ["55672:5672", "55673:15672"]
        options: >-
          --health-cmd="rabbitmq-diagnostics -q ping"
          --health-interval=5s --health-timeout=5s --health-retries=10
      minio:
        image: minio/minio:latest
        env:
          MINIO_ROOT_USER: noc-minio
          MINIO_ROOT_PASSWORD: noc-minio-secret
        ports: ["59000:9000", "59091:9091"]
        options: >-
          --health-cmd="curl -f http://localhost:9000/minio/health/live || exit 1"
          --health-interval=5s --health-timeout=5s --health-retries=10
        # minio's default entrypoint needs an explicit command to serve;
        # GH Actions service containers can't override CMD directly, so
        # this relies on the upstream image's default CMD (server /data)
        # already binding :9000. Console (:9091) isn't required by the
        # app (only the S3 API is used), so a missing console is fine.
    env:
      DATABASE_URL: postgresql+psycopg2://noc:noc@localhost:55432/noc_report
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API dependencies
        working-directory: apps/api
        run: pip install -r requirements.txt
      - name: Wait for MinIO
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:59000/minio/health/live && break
            sleep 2
          done
      - name: Run API test suite (real Postgres/RabbitMQ/MinIO)
        working-directory: apps/api
        run: python -m pytest tests/ -q

  sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run sandbox preprocessing/cache/telemetry/structured-output tests
        run: python -m pytest sandbox/tests/ -q

  bridge:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: noc
          POSTGRES_PASSWORD: noc
          POSTGRES_DB: noc_report
        ports: ["55432:5432"]
        options: >-
          --health-cmd="pg_isready -U noc"
          --health-interval=5s --health-timeout=5s --health-retries=10
      rabbitmq:
        image: rabbitmq:3.13-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: noc
          RABBITMQ_DEFAULT_PASS: noc-rabbit-secret
        ports: ["55672:5672", "55673:15672"]
        options: >-
          --health-cmd="rabbitmq-diagnostics -q ping"
          --health-interval=5s --health-timeout=5s --health-retries=10
      minio:
        image: minio/minio:latest
        env:
          MINIO_ROOT_USER: noc-minio
          MINIO_ROOT_PASSWORD: noc-minio-secret
        ports: ["59000:9000", "59091:9091"]
        options: >-
          --health-cmd="curl -f http://localhost:9000/minio/health/live || exit 1"
          --health-interval=5s --health-timeout=5s --health-retries=10
    env:
      DATABASE_URL: postgresql+psycopg2://noc:noc@localhost:55432/noc_report
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply DB migrations
        working-directory: apps/api
        run: |
          pip install -r requirements.txt
          alembic upgrade head
      - name: Install bridge dependencies
        working-directory: bridge
        run: pip install -r requirements.txt pytest
      - name: Run bridge test suite
        working-directory: bridge
        run: python -m pytest tests/ -q
        # NOC_BRIDGE_LIVE_CLAUDE_TESTS is deliberately left unset here:
        # the one test gated behind it invokes the real Claude Code CLI
        # against a real OAuth-authenticated subscription and spends real
        # usage — never run automatically in CI (see the skip reason in
        # bridge/tests/test_bridge.py).
