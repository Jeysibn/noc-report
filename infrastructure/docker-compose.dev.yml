services:
  postgres:
    image: postgres:16-alpine
    container_name: noc-report-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: noc
      POSTGRES_PASSWORD: noc
      POSTGRES_DB: noc_report
    ports:
      # Host port chosen to avoid colliding with other projects' default
      # 5432 instances already running on this machine.
      - "55432:5432"
    volumes:
      - noc-report-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noc -d noc_report"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: noc-report-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: noc-minio
      MINIO_ROOT_PASSWORD: noc-minio-secret
    command: server /data --console-address ":9091"
    ports:
      # Host ports chosen to avoid colliding with other projects' default
      # 9000/9001 MinIO instances already running on this machine.
      - "59000:9000"
      - "59091:9091"
    volumes:
      - noc-report-minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: noc-report-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: noc
      RABBITMQ_DEFAULT_PASS: noc-rabbit-secret
    ports:
      # Host ports chosen to avoid colliding with other projects' default
      # 5672/15672 RabbitMQ instances already running on this machine.
      - "55672:5672"
      - "55673:15672"
    volumes:
      - noc-report-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Optional Phase 12 local OCR semantic mapper. It is deliberately behind a
  # profile so the normal development stack never loads a model or consumes
  # VM memory. The API remains usable with LOCAL_PREFILL_AI_ENABLED=false.
  ollama:
    image: ollama/ollama:latest
    container_name: noc-report-ollama
    profiles: ["local-ai"]
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: 5m
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    ports:
      - "11434:11434"
    mem_limit: 4g
    cpus: 2.0
    pids_limit: 512
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
    volumes:
      - noc-report-ollama-data:/root/.ollama

  # Dedicated, provider-independent semantic runtime. Its only application
  # network peer is the AI Worker; Postgres/MinIO/RabbitMQ stay on the worker
  # side of the boundary. The API server port is intentionally not published.
  hermes:
    image: ${HERMES_IMAGE:-nousresearch/hermes-agent@sha256:d0fec5607ee4abb603921f93419f937c690cd036e24cb87a0d8dae493dfe2fcc}
    container_name: noc-report-hermes
    restart: unless-stopped
    command:
      - sh
      - -ec
      - |
        profile_dir=/opt/data/profiles/noc-log-analysis
        if [ ! -f "$$profile_dir/SOUL.md" ]; then
          hermes profile create noc-log-analysis
        fi
        # Profile config is repository-owned and must refresh on each image or
        # skill-policy upgrade. Provider credentials remain in the profile
        # .env and are intentionally preserved.
        cp /opt/noc-report/hermes/noc-log-analysis/config.yaml "$$profile_dir/config.yaml"
        touch "$$profile_dir/.noc-report-seeded"
        if ! grep -q '^API_SERVER_KEY=' "$$profile_dir/.env" 2>/dev/null; then
          printf '\nAPI_SERVER_KEY=%s\n' "$$API_SERVER_KEY" >> "$$profile_dir/.env"
        fi
        daily_profile_dir=/opt/data/profiles/noc-daily-report
        daily_created=0
        if [ ! -f "$$daily_profile_dir/SOUL.md" ]; then
          hermes profile create noc-daily-report
          daily_created=1
        fi
        cp /opt/noc-report/hermes/noc-daily-report/config.yaml "$$daily_profile_dir/config.yaml"
        if [ "$$daily_created" = 1 ] && [ -f "$$profile_dir/.env" ]; then
          cp "$$profile_dir/.env" "$$daily_profile_dir/.env"
        fi
        if ! grep -q '^API_SERVER_KEY=' "$$daily_profile_dir/.env" 2>/dev/null; then
          printf '\nAPI_SERVER_KEY=%s\n' "$$API_SERVER_KEY" >> "$$daily_profile_dir/.env"
        fi
        exec hermes gateway run
    environment:
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: "0.0.0.0"
      API_SERVER_PORT: "8642"
      API_SERVER_KEY: ${HERMES_API_KEY:?Set HERMES_API_KEY before starting the Hermes stack}
      # The per-profile .env is created by the command above; this variable is
      # also present for the first profile bootstrap/setup invocation.
      HERMES_SKIP_CONFIG_MIGRATION: "1"
    volumes:
      - noc-report-hermes-data:/opt/data
      - ./hermes/noc-log-analysis/config.yaml:/opt/data/config.yaml:ro
      - ./hermes/noc-log-analysis/config.yaml:/opt/noc-report/hermes/noc-log-analysis/config.yaml:ro
      - ./hermes/noc-daily-report/config.yaml:/opt/noc-report/hermes/noc-daily-report/config.yaml:ro
      - ../skills:/opt/noc-report/skills:ro
    networks:
      - hermes-internal
    mem_limit: 4g
    cpus: 2.0
    pids_limit: 512
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8642/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5

  # The worker is the only component allowed to hold application credentials
  # and the Hermes API key. It consumes log_triage and daily_report jobs.
  ai-worker:
    build:
      context: ..
      dockerfile: bridge/Dockerfile
    container_name: noc-report-ai-worker
    restart: unless-stopped
    command: ["python", "-m", "noc_bridge.worker"]
    environment:
      RUNTIME_RABBITMQ_URL: amqp://noc:noc-rabbit-secret@rabbitmq:5672/
      RUNTIME_DATABASE_URL: postgresql://noc:noc@postgres:5432/noc_report
      RUNTIME_MINIO_ENDPOINT_URL: http://minio:9000
      RUNTIME_MINIO_ACCESS_KEY: noc-minio
      RUNTIME_MINIO_SECRET_KEY: noc-minio-secret
      RUNTIME_HERMES_BASE_URL: http://hermes:8642/p/noc-log-analysis
      RUNTIME_HERMES_API_KEY: ${HERMES_API_KEY:?Set HERMES_API_KEY before starting the Hermes stack}
      RUNTIME_HERMES_PROFILE: noc-log-analysis
      RUNTIME_HERMES_DAILY_REPORT_PROFILE: noc-daily-report
      RUNTIME_HERMES_VERSION: ${HERMES_VERSION:-v0.21.4-2026.9.21}
      RUNTIME_ENVIRONMENT: ${RUNTIME_ENVIRONMENT:-development}
      RUNTIME_HEALTH_PORT: "8092"
      PYTHONPATH: /opt/noc-report/sandbox:/opt/noc-report/bridge
    depends_on:
      hermes:
        condition: service_healthy
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ../skills:/opt/noc-report/skills:ro
    networks:
      - default
      - hermes-internal
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 256
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8092/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 3
    ports:
      # Loopback-only diagnostics for a host-run FastAPI process. The worker
      # remains unreachable from other machines; containerized API deployments
      # should use http://ai-worker:8092/health on the internal network.
      - "127.0.0.1:8092:8092"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  noc-report-postgres-data:
  noc-report-minio-data:
  noc-report-rabbitmq-data:
  noc-report-ollama-data:
  noc-report-hermes-data:

networks:
  hermes-internal:
    driver: bridge
