services:
  postgres:
    image: postgres:16-alpine
    container_name: noc-report-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: noc
      POSTGRES_PASSWORD: noc
      POSTGRES_DB: noc_report
    ports:
      # Host port chosen to avoid colliding with other projects' default
      # 5432 instances already running on this machine.
      - "55432:5432"
    volumes:
      - noc-report-postgres-data:/var/lib/postgresql/data

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: noc-report-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: noc-minio
      MINIO_ROOT_PASSWORD: noc-minio-secret
    command: server /data --console-address ":9091"
    ports:
      # Host ports chosen to avoid colliding with other projects' default
      # 9000/9001 MinIO instances already running on this machine.
      - "59000:9000"
      - "59091:9091"
    volumes:
      - noc-report-minio-data:/data

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: noc-report-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: noc
      RABBITMQ_DEFAULT_PASS: noc-rabbit-secret
    ports:
      # Host ports chosen to avoid colliding with other projects' default
      # 5672/15672 RabbitMQ instances already running on this machine.
      - "55672:5672"
      - "55673:15672"
    volumes:
      - noc-report-rabbitmq-data:/var/lib/rabbitmq

  # Optional Phase 12 local OCR semantic mapper. It is deliberately behind a
  # profile so the normal development stack never loads a model or consumes
  # VM memory. The API remains usable with LOCAL_PREFILL_AI_ENABLED=false.
  ollama:
    image: ollama/ollama:latest
    container_name: noc-report-ollama
    profiles: ["local-ai"]
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: 5m
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    ports:
      - "11434:11434"
    mem_limit: 4g
    cpus: 2.0
    pids_limit: 512
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
    volumes:
      - noc-report-ollama-data:/root/.ollama

volumes:
  noc-report-postgres-data:
  noc-report-minio-data:
  noc-report-rabbitmq-data:
  noc-report-ollama-data:
