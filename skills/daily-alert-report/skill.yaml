# Skill manifest (Reliability mission Batch B; deepened under Skill
# Runtime mission Phase 5) — see
# skills/log-triage-summary/skill.yaml for the full rationale.
id: daily-alert-report
name: daily-alert-report
version: "1"
kind: report
input_contract:
  version: daily-report-context-v1
  filename: snapshot.json
  intro_text: "Here is the frozen shift snapshot to report on:"
output_schema:
  file: output.schema.json
input_projection:
  fields:
    shift_starts_at: shift_starts_at
    shift_ends_at: shift_ends_at
  collections:
    incidents:
      source: incidents
      fields:
        display_id: display_id
        title: title
        status: status
        service: service
        environment: environment
        starts_at: triggered_at
        ends_at: recovered_at
        report_fragment: report_fragment
renderer_profile: report-document-v1
composition_profile: noc-daily-report-v1
coverage:
  incidents: all
  analyses: all_available
  allow_duplicate_incidents: false
  allow_duplicate_analyses: false
execution_policy:
  job_type: daily_report
dependencies:
  - log-triage-summary
description: >
  Produce a compact bilingual General Summary ReportPlan. The application resolves
  incident facts, mandatory coverage, evidence, storage paths, and analysis
  provenance after the response.
