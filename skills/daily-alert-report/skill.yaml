# Skill manifest (Reliability mission Batch B; deepened under Skill
# Runtime mission Phase 5) — see
# skills/log-triage-summary/skill.yaml for the full rationale.
id: daily-alert-report
name: daily-alert-report
version: "1"
kind: report
input_contract:
  version: daily-report-context-v1
  filename: snapshot.json
  intro_text: "Here is the frozen shift snapshot to report on:"
output_schema:
  file: output.schema.json
input_projection:
  fields:
    shift_starts_at: shift_starts_at
    shift_ends_at: shift_ends_at
  collections:
    incidents:
      source: incidents
      fields:
        id: id
        display_id: display_id
        title: title
        status: status
        service: service
        environment: environment
        starts_at: triggered_at
        ends_at: recovered_at
        analysis_run_id: analysis_run_id
        report_fragment: report_fragment
renderer_profile: report-document-v1
execution_policy:
  job_type: daily_report
dependencies:
  - log-triage-summary
description: >
  Produce a compact ReportPlan. References are IDs only; the application
  resolves incident facts, evidence, storage paths, and analysis provenance.
