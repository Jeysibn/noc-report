# Skill manifest (Reliability mission Batch B; deepened under Skill
# Runtime mission Phase 5) — see
# skills/log-triage-summary/skill.yaml for the full rationale.
id: daily-alert-report
name: daily-alert-report
version: "1"
kind: report
input_contract:
  version: daily-report-context-v1
  filename: snapshot.json
  intro_text: "Here is the frozen shift snapshot to report on:"
output_schema:
  file: output.schema.json
input_projection:
  fields:
    shift_starts_at: shift_starts_at
    shift_ends_at: shift_ends_at
  collections:
    incidents:
      source: incidents
      fields:
        id: id
        display_id: display_id
        title: title
        status: status
        service: service
        environment: environment
        grafana_url: grafana_url
        log_filename: log_filename
        screenshots: screenshots
        starts_at: triggered_at
        ends_at: recovered_at
        analysis_run_id: analysis_run_id
        summary_en: analysis.summary_en
        summary_zh: analysis.summary_zh
        key_finds: analysis.key_finds
        secondary_finds: analysis.secondary_finds
        likely_cause_en: analysis.likely_cause_en
        likely_cause_zh: analysis.likely_cause_zh
        recommended_action_en: analysis.recommended_action_en
        recommended_action_zh: analysis.recommended_action_zh
        severity_signal: analysis.severity_signal
renderer_profile: report-document-v1
execution_policy:
  job_type: daily_report
dependencies:
  - log-triage-summary
description: >
  Produce a semantic daily alert ReportDocument from a frozen shift
  snapshot and its exact incident/evidence provenance.
